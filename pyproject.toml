[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Working name. Verify on PyPI before the first release: "agentbus", "agent-mailbox",
# "agent-watchdog" and "deadman" are all taken. See docs/COMPETITION.md.
name = "nightshift"
version = "0.1.0"
description = "Reliability layer for unattended agent mailboxes: leases, heartbeats, and silent-failure detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agents", "multi-agent", "reliability", "mailbox", "unattended"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nightshift = "nightshift.cli:main"

[project.urls]
Documentation = "https://github.com/OWNER/nightshift#readme"
Issues = "https://github.com/OWNER/nightshift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
