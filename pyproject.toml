[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Name checked on PyPI 2026-10-23. "nightshift", "agentbus", "agent-mailbox",
# "agent-watchdog", "deadman", "backstop", "watchpost", "handover" are all taken.
# See docs/COMPETITION.md.
name = "keepwatch"
version = "0.2.1"
description = "Reliability layer for unattended agent mailboxes: leases, heartbeats, and silent-failure detection."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agents", "multi-agent", "reliability", "mailbox", "unattended"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keepwatch = "keepwatch.cli:main"

[project.urls]
Documentation = "https://github.com/OWNER/keepwatch#readme"
Issues = "https://github.com/OWNER/keepwatch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
