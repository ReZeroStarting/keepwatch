name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 runs on Linux only: the windows-latest 3.9 runner is the flakiest
        # combination we had (it stalled in setup-python on a commit that was
        # otherwise green). Linux still proves 3.9 compatibility.
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no dependencies on purpose)
        run: python -m pip install --no-deps -e .
      - name: Import check
        run: python -c "import nightshift; print(nightshift.__version__)"
      - name: Tests
        run: python -m unittest discover -s tests -v
