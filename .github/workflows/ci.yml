name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no dependencies on purpose)
        run: python -m pip install --no-deps -e .
      - name: Import check
        run: python -c "import nightshift; print(nightshift.__version__)"
      - name: Tests
        run: python -m unittest discover -s tests -v
